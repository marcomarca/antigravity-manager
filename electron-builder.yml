appId: com.antigravity.projectlauncher
productName: Antigravity Project Launcher
directories:
  output: release
  buildResources: resources

files:
  - "dist/**/*"
  - "resources/**/*"
  - "package.json"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Antigravity Project Launcher
